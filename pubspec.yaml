name: r0_app
description: A Flutter app for recording and reporting workflow reports, truck, heavy vehicle, and factory reports.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.0.0
  cupertino_icons: ^1.0.6
  provider: ^6.1.1
  sqflite: ^2.3.0
  path: ^1.8.3
  intl: ^0.20.2
  google_maps_flutter: ^2.5.0
  shared_preferences: ^2.2.2
  shared_preferences_android: ^2.2.2
  shared_preferences_ios: ^2.1.1
  shared_preferences_linux: ^2.2.2
  shared_preferences_web: ^2.2.2
  shared_preferences_windows: ^2.2.2
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  uuid: ^4.3.3
  flutter_time_picker_spinner: ^2.0.0
  firebase_core: ^2.32.0
  firebase_auth: ^4.17.6
  cloud_firestore: ^4.15.8

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  generate: true  # For internationalization
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf

  assets:
    - assets/translations/
    - assets/images/
    - assets/fonts/
    - assets/fonts/NotoSans-Regular.ttf 

icons_launcher:
  image_path: "assets/images/logo.png"
  platforms:
    android:
      enable: true
      image_path: "assets/images/logo.png"
      notification_image: "assets/images/logo.png"
      # adaptive_background_color: '#ffffff'
      adaptive_background_image: "assets/images/logo.png"
      adaptive_foreground_image: "assets/images/logo.png"
      adaptive_round_image: "assets/images/logo.png"
      adaptive_monochrome_image: "assets/images/logo.png"
    ios:
      enable: true
      image_path: "assets/images/logo.png"
      # For iOS 18+ (support dark and tinted)
      dark_path: "assets/images/logo.png"
      tinted_path: "assets/images/logo.png"
    web:
      enable: true
      image_path: "assets/images/logo.png"
      favicon_path: "assets/images/logo.png"
    macos:
      enable: false
      image_path: "assets/images/logo.png"
    windows:
      enable: false
      image_path: "assets/images/logo.png"
    linux:
      enable: false
      image_path: "assets/images/logo.png"

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"